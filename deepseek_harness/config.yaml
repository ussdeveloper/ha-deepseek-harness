name: "DeepSeek Harness"
version: "0.1.34"
slug: "deepseek_harness"
description: "DeepSeek Harness agent for Home Assistant: configure, monitor, maintain and extend your smart home safely."
url: "https://github.com/ussdeveloper/ha-deepseek-harness"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: experimental

# Ingress only: the UI is reachable through Home Assistant's authenticated proxy.
# There is no published port, so the DSH web server is never exposed directly.
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:robot-happy-outline"
panel_title: "DeepSeek Harness"
panel_admin: true

# Supervisor + Home Assistant API access for the agent.
hassio_api: true
hassio_role: admin
homeassistant_api: true
# Host-level access: the agent is explicitly meant to operate the HA OS host and
# other apps. These grants become effective once protection mode is off; the
# add-on disables its own protection mode by default at startup.
docker_api: true
host_pid: true
full_access: true
# The default AppArmor profile blocks setns/ptrace, which the host terminal
# needs. Disabling it is required for host-level operation of this app.
apparmor: false

# Files the agent may use: the HA configuration (read/write) and the local
# add-ons folder (read/write, for the add-on builder). Read-only: share, ssl.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: local_apps
    read_only: false
    path: /addons
  - type: share
    read_only: true
  - type: ssl
    read_only: true

options:
  base_url: "https://api.deepseek.com/anthropic"
  read_only: false
  full_access: true
  allow_restarts: false
  allow_addon_management: false
  allow_host_management: true
  protection_mode: false
  monitor_enabled: true
  first_run_analysis: true
  notify_service: ""
  backup_retention: 7
  quiet_hours: ""
  public_url: ""

schema:
  deepseek_api_key: "password?"
  base_url: "url"
  read_only: "bool"
  full_access: "bool"
  allow_restarts: "bool"
  allow_addon_management: "bool"
  allow_host_management: "bool"
  protection_mode: "bool"
  monitor_enabled: "bool"
  first_run_analysis: "bool"
  notify_service: "str?"
  backup_retention: "int(1,90)"
  quiet_hours: "match(^$|^([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$)"
  public_url: "str?"

environment:
  DSH_HOME: "/data/dsh-home"
  NODE_ENV: "production"

watchdog: "tcp://[HOST]:[PORT:8099]"
backup: cold
backup_exclude:
  - "*.log"
  - "tmp/*"
timeout: 30



































