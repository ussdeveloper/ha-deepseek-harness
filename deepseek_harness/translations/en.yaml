configuration:
  deepseek_api_key:
    name: "DeepSeek API key"
    description: >-
      Key from platform.deepseek.com. Stored by Home Assistant in the add-on
      configuration (and included in backups). Leave empty to enter it later in
      the DeepSeek Harness UI.
  base_url:
    name: "API base URL"
    description: "DeepSeek Anthropic-compatible API base (https://api.deepseek.com/anthropic). Change only for proxies or self-hosted gateways."
  read_only:
    name: "Read-only mode"
    description: >-
      Disables every tool that changes Home Assistant. Recommended while
      evaluating the agent.
  full_access:
    name: "Full access (recommended)"
    description: >-
      Boots DSH with danger-full-access inside the add-on container so the agent
      can read and fix the local Home Assistant instance without sandbox
      friction. Destructive actions still require the plugin's confirmation
      tokens, and the read_only option still wins when enabled.
  allow_restarts:
    name: "Allow Home Assistant restarts"
    description: >-
      Allows the agent to restart Home Assistant Core after explicit
      confirmation. Off by default.
  allow_addon_management:
    name: "Allow app (add-on) management"
    description: >-
      Allows install, update, rebuild and uninstall of apps after explicit
      confirmation. Off by default.
  allow_host_management:
    name: "Allow host management"
    description: >-
      Allows host reboot/shutdown, OS updates and reading host logs/network
      through the Supervisor (admin role). Destructive host actions still
      require explicit confirmation tokens. On by default.
  protection_mode:
    name: "Protection mode"
    description: >-
      Off by default: the add-on disables its own protection mode at startup so
      the container receives docker_api, host_pid and full_access. This is what
      gives the agent host-terminal and host-file access; Home Assistant warns
      that this is a privileged app.
  monitor_enabled:
    name: "Enable monitoring"
    description: "Periodic health checks, backup-age checks and the daily digest."
  first_run_analysis:
    name: "First-run system analysis"
    description: >-
      On the first start with an API key configured, run one read-only
      assessment of Home Assistant, its apps and backups, write a report to
      /config/deepseek-harness and open that session by default. Costs one
      model conversation; the deterministic inventory report is always written.
  notify_service:
    name: "Notification service"
    description: >-
      Optional notify entity or action for alerts, e.g. notify.mobile_app_phone.
      Empty means persistent notifications inside Home Assistant only.
  backup_retention:
    name: "Backups to keep"
    description: "How many automatic backups the agent may keep (1-90)."
  quiet_hours:
    name: "Quiet hours"
    description: >-
      Optional HH:MM-HH:MM window when non-critical notifications are held,
      e.g. 22:00-07:00.
  public_url:
    name: "Public Home Assistant URL"
    description: >-
      Optional. Set if you access Home Assistant through a fixed external URL
      (e.g. Nabu Casa); used only for links the agent generates.



