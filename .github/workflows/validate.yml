name: Validate add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate repository, plugin bundle and skills
        run: node scripts/check-addon.mjs

      - name: Run plugin tests
        run: node tests/plugin/core.test.mjs

      - name: Run state tool tests
        run: node tests/plugin/state.test.mjs

      - name: Run ingress shim tests
        run: node tests/runtime/shim.test.mjs

      - name: Syntax-check runtime modules
        run: |
          node --check deepseek_harness/rootfs/opt/ha-dsh/runtime/entrypoint.mjs
          node --check deepseek_harness/rootfs/opt/ha-dsh/runtime/ingress-shim.mjs
          node --check deepseek_harness/rootfs/opt/ha-dsh/runtime/collector.mjs

  build-image:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the add-on image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: deepseek_harness
          file: deepseek_harness/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=0.1.0
